<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoTask Landing Page</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header-container">
      <div class="brand-container">
        <img src="../img/logo.png" alt="logo-chrono-task" class="logo-image" />

        <p class="chrono-teks">Chrono Task</p>
      </div>

      <nav class="navbar-container">
        <ul class="ul-nav">
          <li class="li-nav"><a href="" class="a-li">Features</a></li>
          <li class="li-nav"><a href="" class="a-li">Solutions</a></li>
          <li class="li-nav"><a href="" class="a-li">Resources</a></li>
          <li class="li-nav"><a href="" class="a-li">Pricing</a></li>
        </ul>
      </nav>

      <div class="button-container">
        <button class="button" type="submit">Sign in</button>
        <button class="button" type="button">Get demo</button>
      </div>
    </header>
    <!-- header end -->

    <!-- main -->
    <main class="main-container">
      <!-- Pindahkan 4 gambar ini ke DALAM main -->
      <img
        src="../img/sticky-note.png"
        class="floating-img img-top-left"
        alt="Sticky Note"
      />
      <img
        src="../img/reminders.png"
        class="floating-img img-top-right"
        alt="Reminders"
      />
      <img
        src="../img/today-task.png"
        class="floating-img img-bottom-left"
        alt="Today Tasks"
      />
      <img
        src="../img/integrations.png"
        class="floating-img img-bottom-right"
        alt="Integrations"
      />

      <div class="judul-container">
        <img src="../img/logo.png" alt="logo-layar" class="logo-judul" />
        <p class="teks-container">
          <span class="span-1">Think, Plan, and Track</span>
          <span class="span-2">all in one place</span
          ><span class="span-3"
            >efficiently manageyour task and boost productivity</span
          >
        </p>
        <button type="button" class="button-judul">Get free demo</button>
      </div>
    </main>
    <!-- main end -->
  </body>
</html>
