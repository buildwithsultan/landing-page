<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bellroy Landing Page</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header-container">
      <div class="brand-container">
        <img src="../img/logo.png" alt="logo-bellroy" class="logo-container" />
        <p class="bellroy-teks">Bellroy</p>
      </div>

      <nav class="nav-container">
        <ul class="ul-container">
          <li class="li-container">Featured</li>
          <li class="li-container">Bags & Luggage</li>
          <li class="li-container">Travel</li>
          <li class="li-container">Wallets</li>
          <li class="li-container">Tech</li>
          <li class="li-container">Accessories</li>
          <li class="li-container">About Us</li>
        </ul>
      </nav>

      <div class="button-container">
        <button type="button">Need help?</button>
        <button type="button">Find In-Store</button>
      </div>
    </header>
    <!-- header end -->

    <!-- search bar -->
    <div class="container-search">
      <form action="/search" method="GET" class="search-form">
        <input
          type="search"
          name="q"
          placeholder="What are you looking for?"
          class="input-container"
        />
      </form>
    </div>
    <!-- search bar end -->

    <!-- main -->
    <main class="hero-section">
      <div class="hero-content">
        <h1>CARRY SMART. <br />MOVE FREE. <br />GO FAR.</h1>
        <a href="#" class="btn-bestsellers">BESTSELLERS</a>
      </div>
    </main>
    <!-- main end -->
  </body>
</html>
