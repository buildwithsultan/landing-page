<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Try Bellroy Landing Page</title>
    <link rel="stylesheet" href="../css/try.css" />
  </head>
  <body>
    <!-- header -->
    <header class="header-container">
      <div class="brand-container">
        <img src="../img/logo.png" alt="" class="logo-img" />
        <p class="teks-container">Bellroy</p>
      </div>

      <nav class="nav-container">
        <ul class="ul-container">
          <li class="li-container">Featured</li>
          <li class="li-container">Bags & Luggage</li>
          <li class="li-container">Travel</li>
          <li class="li-container">Wallets</li>
          <li class="li-container">Tech</li>
          <li class="li-container">Accessories</li>
          <li class="li-container">About Us</li>
        </ul>
      </nav>

      <div class="btn-container">
        <button type="button" class="button-header">Need help?</button>
        <button type="button" class="button-header">Find In-Store</button>
      </div>
    </header>
    <!-- header end-->

    <!-- search bar -->
    <div class="search-container">
      <form action="/search" method="get" class="form-search">
        <input
          type="search"
          name="q"
          placeholder="What are you looking for?"
          class="input-container"
        />
      </form>
    </div>
    <!-- search bar end -->

    <!-- main -->
    <main class="main-container">
      <div class="hero-content">
        <h1>
          CARRY SMART. <br />
          MOVE FREE. <br />
          GO FAR.
        </h1>
        <a href="#" class="btn-bestsellers">BESTSELLERS</a>
      </div>
    </main>
    <!-- main end -->
  </body>
</html>
